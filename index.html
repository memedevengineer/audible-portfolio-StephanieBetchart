<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Works I've Narrated</title>

  <style>
    body {
      margin: 0;
      padding: 30px;
      background: transparent;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-bottom: 10px;
    }

    .stats {
      margin-bottom: 24px;
      color: #ccc;
    }

    .stats p {
      margin: 4px 0;
      font-size: 15px;
    }

    .carousel-wrapper {
      position: relative;
      overflow: hidden;
    }

    .carousel {
      display: flex;
      gap: 22px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 20px;

      /* hide scrollbar */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .book-card {
      min-width: 210px;
      max-width: 210px;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: transparent;
      flex-shrink: 0;
    }

    .book-card img {
      width: 100%;
      display: block;
      border-radius: 14px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      opacity: 0;
      transition: opacity 0.25s ease;
      padding: 16px;
      box-sizing: border-box;
      overflow-y: auto;

      /* hide overlay scrollbar */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .overlay::-webkit-scrollbar {
      display: none;
    }

    .book-card:hover .overlay {
      opacity: 1;
    }

    .overlay h3 {
      font-size: 16px;
      margin: 0 0 8px;
    }

    .overlay p {
      font-size: 13px;
      color: #ddd;
      margin: 6px 0;
    }

    .overlay a {
      color: #d8b46a;
      font-weight: bold;
      text-decoration: none;
      font-size: 13px;
    }

    .narrator-link {
      display: block;
      margin-top: 4px;
    }

    .buttons {
      margin-top: 18px;
    }

    button {
      background: #d8b46a;
      border: none;
      color: #111;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 8px;
    }

    .last-updated {
      position: fixed;
      right: 10px;
      bottom: 8px;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.2;
      z-index: 50;
    }
  </style>
</head>

<body>

  <h1>Books I've Narrated</h1>

  <div class="stats">
    <p><strong>Total audiobooks narrated:</strong> <span id="totalBooks">0</span></p>
  </div>

  <div class="carousel-wrapper">
    <div id="books" class="carousel"></div>
  </div>

  <div class="buttons">
    <button onclick="scrollCarousel(-1)">←</button>
    <button onclick="scrollCarousel(1)">→</button>
  </div>

  <div class="last-updated">
    Last updated: <span id="lastUpdated">Loading...</span>
  </div>

  <script>
    const carousel = document.getElementById("books");

    function scrollCarousel(direction) {
      carousel.scrollBy({
        left: direction * 260,
        behavior: "smooth"
      });
    }

    function formatDate(dateString) {
      if (!dateString) return "Not available";

      const date = new Date(dateString);

      return date.toLocaleString("en-US", {
        timeZone: "America/New_York",
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short"
      });
    }

    fetch("books.json")
      .then(response => response.json())
      .then(data => {
        document.getElementById("totalBooks").textContent = data.total_books || 0;
        document.getElementById("lastUpdated").textContent = formatDate(data.last_updated);

        data.books.forEach(book => {
          const div = document.createElement("div");
          div.className = "book-card";

          const narrators = book.co_narrators && book.co_narrators.length
            ? book.co_narrators.map(n =>
                `<a class="narrator-link" href="${n.audible_list}" target="_blank">${n.name}</a>`
              ).join("")
            : "Not listed";

          div.innerHTML = `
            <img src="${book.cover}" alt="${book.title}">

            <div class="overlay">
              <h3>${book.title}</h3>
              <p><strong>Author:</strong> ${book.author || "Not listed"}</p>
              <p><strong>Release:</strong> ${book.release_date || "Not listed"}</p>
              <p><strong>Narrators:</strong></p>
              ${narrators}
              <br>
              <a href="${book.audible_url}" target="_blank">Listen on Audible</a>
            </div>
          `;

          carousel.appendChild(div);
        });
      });
  </script>

</body>
</html>
