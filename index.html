<!DOCTYPE html>
<html>
<head>
  
  <meta charset="UTF-8" />
  <title>Books I've Narrated</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: transparent;
      color: white;
      font-family: Arial, sans-serif;
    }

  .books-section h1 {
  font-size: 1.7rem;
  margin: 0 0 10px 0;

  font-weight: 800;
  letter-spacing: 1px;

  color: #c48b36;

  text-transform: uppercase;

  font-family: "Arial Black", sans-serif;

  text-shadow:
    0 2px 10px rgba(0,0,0,0.8),
    0 0 25px rgba(0,0,0,0.55);
}

    .books-section h1 {
      font-size: 1.7rem;
      margin: 0 0 10px 0;

      font-weight: 800;
      letter-spacing: 1px;

      color: #c48b36;

      text-shadow:
        0 2px 10px rgba(0,0,0,0.8),
        0 0 25px rgba(0,0,0,0.55);
    }

    .stats {
      margin-bottom: 24px;
      color: rgba(255,255,255,0.9);
    }

    .stats p {
      margin: 4px 0;
      font-size: 1rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.85);
    }

    .carousel-container {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      overflow: hidden;
    }

    .carousel-wrapper {
      width: 100%;
      overflow: hidden;
    }

    .carousel {
      display: flex;
      gap: 22px;
      width: max-content;
      padding-bottom: 20px;

      animation: autoScroll 45s linear infinite;

      scrollbar-width: none;
      -ms-overflow-style: none;
      will-change: transform;
    }

    .carousel:hover {
      animation-play-state: paused;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    @keyframes autoScroll {
      0% {
        transform: translate3d(0,0,0);
      }

      100% {
        transform: translate3d(-50%,0,0);
      }
    }

    .book-card {
      min-width: 210px;
      max-width: 210px;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,0.05);
      flex-shrink: 0;

      border: 1px solid rgba(255,255,255,0.08);

      box-shadow:
        0 0 18px rgba(0,0,0,0.25);
    }

    .book-card img {
      width: 100%;
      display: block;
      border-radius: 14px;
      transition: transform 0.25s ease;
    }

    .book-card:hover img {
      transform: scale(1.03);
    }

    .overlay {
      position: absolute;
      inset: 0;

      background: rgba(0, 0, 0, 0.88);

      opacity: 0;
      transition: opacity 0.25s ease;

      padding: 16px;
      box-sizing: border-box;

      overflow-y: auto;

      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .overlay::-webkit-scrollbar {
      display: none;
    }

    .book-card:hover .overlay {
      opacity: 1;
    }

    .overlay h3 {
      font-size: 16px;
      margin: 0 0 8px;

      color: rgba(255,255,255,0.96);

      text-shadow:
        0 2px 10px rgba(0,0,0,0.8);
    }

    .overlay p {
      font-size: 13px;
      color: rgba(255,255,255,0.82);
      margin: 6px 0;

      text-shadow:
        0 2px 8px rgba(0,0,0,0.85);
    }

    .overlay a {
      text-decoration: none;
    }

    .audible-button {
      display: flex;
      justify-content: center;
      align-items: center;

      margin-top: 16px;
      width: 100%;

      background: #c48b36;
      color: white;

      border-radius: 8px;

      padding: 10px 12px;

      font-size: 13px;
      font-weight: bold;

      box-sizing: border-box;

      transition: 0.2s ease;

      box-shadow:
        0 0 12px rgba(196,139,54,0.25);
    }

    .audible-button:hover {
      background: #d89b40;
      transform: scale(1.02);

      box-shadow:
        0 0 18px rgba(196,139,54,0.45);
    }

    .narrator-link {
      display: block;
      margin-top: 4px;
      color: #c48b36;
      font-size: 13px;
    }

    .carousel-arrow {
      position: absolute;
      z-index: 20;

      width: 42px;
      height: 42px;

      border-radius: 50%;
      border: none;

      background: rgba(196, 139, 54, 0.92);

      color: white;

      cursor: pointer;

      font-size: 22px;

      transition: 0.2s ease;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 0 14px rgba(196,139,54,0.35);
    }

    .carousel-arrow:hover {
      background: #c48b36;
      transform: scale(1.08);

      box-shadow:
        0 0 22px rgba(196,139,54,0.55);
    }

    .left-arrow {
      left: 4px;
    }

    .right-arrow {
      right: 4px;
    }

    .last-updated {
      margin-top: 4px;
      text-align: right;
      font-size: 10px;
      color: white;
      opacity: 0.85;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px;
      }

      .books-section {
        padding: 22px;
      }

      .books-section h1 {
        font-size: 1.9rem;
      }

      .book-card {
        min-width: 185px;
        max-width: 185px;
      }
    }
  </style>
</head>

<body>

  <div class="books-section">

    <h1>Books I've Narrated</h1>

    <div class="stats">
      <p>
        <strong>Total audiobooks narrated:</strong>
        <span id="totalBooks">0</span>
      </p>
    </div>

    <div class="carousel-container">

      <button class="carousel-arrow left-arrow" onclick="scrollCarousel(-1)">
        &#10094;
      </button>

      <div class="carousel-wrapper">
        <div id="books" class="carousel"></div>
      </div>

      <button class="carousel-arrow right-arrow" onclick="scrollCarousel(1)">
        &#10095;
      </button>

    </div>

    <div class="last-updated">
      Last updated:
      <span id="lastUpdated">Loading...</span>
    </div>

  </div>

  <script>
    const carousel = document.getElementById("books");

    function scrollCarousel(direction) {
      carousel.style.animationPlayState = "paused";

      carousel.scrollBy({
        left: direction * 260,
        behavior: "smooth"
      });

      setTimeout(() => {
        carousel.style.animationPlayState = "running";
      }, 3000);
    }

    function formatDate(dateString) {
      if (!dateString) return "Not available";

      const date = new Date(dateString);

      return date.toLocaleString("en-US", {
        timeZone: "America/New_York",
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short"
      });
    }

    fetch("books.json")
      .then(response => response.json())
      .then(data => {
        document.getElementById("totalBooks").textContent =
          data.total_books || 0;

        document.getElementById("lastUpdated").textContent =
          formatDate(data.last_updated);

        const doubledBooks = [...data.books, ...data.books];

        doubledBooks.forEach(book => {
          const div = document.createElement("div");
          div.className = "book-card";

          const narrators =
            book.co_narrators && book.co_narrators.length
              ? book.co_narrators.map(n =>
                  `<a class="narrator-link"
                      href="${n.audible_list}"
                      target="_blank">
                      ${n.name}
                   </a>`
                ).join("")
              : "Not listed";

          div.innerHTML = `
            <img src="${book.cover}" alt="${book.title}">

            <div class="overlay">
              <h3>${book.title}</h3>

              <p>
                <strong>Author:</strong>
                ${book.author || "Not listed"}
              </p>

              <p>
                <strong>Release:</strong>
                ${book.release_date || "Not listed"}
              </p>

              <p>
                <strong>Narrators:</strong>
              </p>

              ${narrators}

              <a class="audible-button"
                 href="${book.audible_url}"
                 target="_blank">
                 Listen on Audible
              </a>
            </div>
          `;

          carousel.appendChild(div);
        });
      });
  </script>

</body>
</html>
