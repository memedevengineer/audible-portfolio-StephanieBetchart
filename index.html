<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Books I've Narrated</title>

  <style>
    body {
      margin: 0;
      padding: 30px;
      background: transparent;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-bottom: 10px;
    }

    .stats {
      margin-bottom: 24px;
      color: #ccc;
    }

    .stats p {
      margin: 4px 0;
      font-size: 15px;
    }

    .carousel-container {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .carousel-wrapper {
      width: 100%;
      overflow: hidden;
    }

    .carousel {
      display: flex;
      gap: 22px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 20px;

      /* Hide scrollbar */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .book-card {
      min-width: 210px;
      max-width: 210px;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: transparent;
      flex-shrink: 0;
    }

    .book-card img {
      width: 100%;
      display: block;
      border-radius: 14px;
      transition: transform 0.25s ease;
    }

    .book-card:hover img {
      transform: scale(1.03);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      opacity: 0;
      transition: opacity 0.25s ease;
      padding: 16px;
      box-sizing: border-box;
      overflow-y: auto;

      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .overlay::-webkit-scrollbar {
      display: none;
    }

    .book-card:hover .overlay {
      opacity: 1;
    }

    .overlay h3 {
      font-size: 16px;
      margin: 0 0 8px;
    }

    .overlay p {
      font-size: 13px;
      color: #ddd;
      margin: 6px 0;
    }

    .overlay a {
      color: #c48b36;
      font-weight: bold;
      text-decoration: none;
      font-size: 13px;
    }

    .narrator-link {
      display: block;
      margin-top: 4px;
    }

    .carousel-arrow {
      position: absolute;
      z-index: 20;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(196, 139, 54, 0.92);
      color: white;
      cursor: pointer;
      font-size: 22px;
      transition: 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-arrow:hover {
      background: #c48b36;
      transform: scale(1.08);
    }

    .left-arrow {
      left: -10px;
    }

    .right-arrow {
      right: -10px;
    }

    .last-updated {
      margin-top: 4px;
      text-align: right;
      font-size: 10px;
      color: rgba(255,255,255,0.45);
    }
  </style>
</head>

<body>

  <h1>Books I've Narrated</h1>

  <div class="stats">
    <p><strong>Total audiobooks narrated:</strong> <span id="totalBooks">0</span></p>
  </div>

  <div class="carousel-container">

    <button class="carousel-arrow left-arrow" onclick="scrollCarousel(-1)">
      &#10094;
    </button>

    <div class="carousel-wrapper">
      <div id="books" class="carousel"></div>
    </div>

    <button class="carousel-arrow right-arrow" onclick="scrollCarousel(1)">
      &#10095;
    </button>

  </div>

  <div class="last-updated">
    Last updated: <span id="lastUpdated">Loading...</span>
  </div>

  <script>
    const carousel = document.getElementById("books");

    function scrollCarousel(direction) {
      carousel.scrollBy({
        left: direction * 260,
        behavior: "smooth"
      });
    }

    function formatDate(dateString) {
      if (!dateString) return "Not available";

      const date = new Date(dateString);

      return date.toLocaleString("en-US", {
        timeZone: "America/New_York",
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short"
      });
    }

    fetch("books.json")
      .then(response => response.json())
      .then(data => {

        document.getElementById("totalBooks").textContent =
          data.total_books || 0;

        document.getElementById("lastUpdated").textContent =
          formatDate(data.last_updated);

        data.books.forEach(book => {

          const div = document.createElement("div");
          div.className = "book-card";

          const narrators =
            book.co_narrators && book.co_narrators.length
              ? book.co_narrators.map(n =>
                  `<a class="narrator-link"
                      href="${n.audible_list}"
                      target="_blank">
                      ${n.name}
                   </a>`
                ).join("")
              : "Not listed";

          div.innerHTML = `
            <img src="${book.cover}" alt="${book.title}">

            <div class="overlay">

              <h3>${book.title}</h3>

              <p>
                <strong>Author:</strong>
                ${book.author || "Not listed"}
              </p>

              <p>
                <strong>Release:</strong>
                ${book.release_date || "Not listed"}
              </p>

              <p>
                <strong>Narrators:</strong>
              </p>

              ${narrators}

              <br>

              <a href="${book.audible_url}" target="_blank">
                Listen on Audible
              </a>

            </div>
          `;

          carousel.appendChild(div);
        });
      });
  </script>

</body>
</html>
